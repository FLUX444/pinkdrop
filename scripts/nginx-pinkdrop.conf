# PINKDROP — полный конфиг nginx для VPS
# Домен: pinkdrop.ru
# Фронт: /var/www/pinkdrop  (npm run build → cp dist/*)
# API:  PM2 pinkdrop-api на порту 3001
#
# Установка на VPS:
#   sudo cp ~/pinkdrop/scripts/nginx-pinkdrop.conf /etc/nginx/sites-available/pinkdrop
#   sudo ln -sf /etc/nginx/sites-available/pinkdrop /etc/nginx/sites-enabled/pinkdrop
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (если ещё нет сертификата):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d pinkdrop.ru -d www.pinkdrop.ru

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name pinkdrop.ru www.pinkdrop.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/pinkdrop;
    }

    location / {
        return 301 https://pinkdrop.ru$request_uri;
    }
}

# www → без www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.pinkdrop.ru;

    ssl_certificate     /etc/letsencrypt/live/pinkdrop.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinkdrop.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://pinkdrop.ru$request_uri;
}

# Основной сайт
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pinkdrop.ru;

    ssl_certificate     /etc/letsencrypt/live/pinkdrop.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinkdrop.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/pinkdrop;
    index index.html;

    # Загрузка аватаров и медиа (до 25 МБ)
    client_max_body_size 25m;

    access_log /var/log/nginx/pinkdrop.access.log;
    error_log  /var/log/nginx/pinkdrop.error.log;

    # API (Node.js / PM2)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Аватары, отзывы, поддержка — отдаёт API из ~/pinkdrop/public/uploads
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Картинки товаров (если лежат в public/images)
    location /images/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Карта сайта для Google / Yandex
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика Vite (кэш)
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.svg {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    # React SPA — все маршруты (/cart, /profile, /product/...)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
